<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กรอกข้อมูลติดต่อ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%);
            padding: 20px;
            overflow: hidden;
            position: relative;
        }

        /* ตกแต่งวงกลมสะท้อนแสงด้านหลังสไตล์ Glassmorphism */
        .background-blob-1 {
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 182, 193, 0.6);
            filter: blur(80px);
            border-radius: 50%;
            top: 15%;
            left: 20%;
            z-index: 1;
        }

        .background-blob-2 {
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(0, 212, 255, 0.5);
            filter: blur(90px);
            border-radius: 50%;
            bottom: 15%;
            right: 20%;
            z-index: 1;
        }

        /* Glass Container Card */
        .glass-card {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 28px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15),
                        inset 0 1px 1px rgba(255, 255, 255, 0.6);
            padding: 40px 32px;
            color: #1d1d1f;
        }

        .glass-card h2 {
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
            color: #1d1d1f;
        }

        .glass-card p.subtitle {
            font-size: 15px;
            text-align: center;
            color: rgba(30, 30, 30, 0.7);
            margin-bottom: 28px;
            font-weight: 400;
        }

        .input-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: rgba(20, 20, 20, 0.85);
            margin-left: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 18px;
            font-size: 16px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #1d1d1f;
            outline: none;
            transition: all 0.25s ease;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.05);
        }

        .input-group input::placeholder {
            color: rgba(60, 60, 67, 0.45);
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.75);
            border-color: #0071e3;
            box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.2);
        }

        /* Apple Style Glass Button */
        button[type="submit"] {
            width: 100%;
            padding: 16px;
            font-size: 17px;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #0071e3 0%, #42a5f5 100%);
            border: none;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(0, 113, 227, 0.3),
                        inset 0 1px 1px rgba(255, 255, 255, 0.4);
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(0, 113, 227, 0.4),
                        inset 0 1px 1px rgba(255, 255, 255, 0.6);
        }

        button[type="submit"]:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(0, 113, 227, 0.2);
        }
    </style>
</head>
<body>

    <div class="background-blob-1"></div>
    <div class="background-blob-2"></div>

    <div class="glass-card">
        <h2>กรอกข้อมูลติดต่อ</h2>
        <p class="subtitle">โปรดระบุข้อมูลของท่านเพื่อรับข่าวสารและบริการ</p>

        <form action="https://formspree.io/f/xdeavyvo" method="POST">
            <div class="input-group">
                <label for="phone">เบอร์โทรศัพท์</label>
                <input type="tel" id="phone" name="phone" placeholder="08X-XXX-XXXX" pattern="[0-9]{9,10}" title="กรุณากรอกเบอร์โทรศัพท์ตัวเลข 9-10 หลัก" required>
            </div>

            <div class="input-group">
                <label for="email">อีเมล</label>
                <input type="email" id="email" name="email" placeholder="example@email.com" required>
            </div>

            <button type="submit">บันทึกข้อมูล</button>
        </form>
    </div>

</body>
</html>
